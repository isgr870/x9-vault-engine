name: Build X9 Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Android SDK & Accept Licenses
      uses: android-actions/setup-android@v3
      with:
        packages: 'build-tools;33.0.2 platforms;android-33 platform-tools'
        accept-android-sdk-licenses: true

    - name: Install System Dependencies & Rust
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential ccache git libffi-dev libssl-dev python3-dev \
          zip unzip autoconf libtool pkg-config zlib1g-dev \
          libncurses-dev cmake rustc cargo

    - name: Install Rust Android Targets
      run: |
        rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android i686-linux-android

    - name: Install Pinned Python Build Tools
      run: |
        python -m pip install --upgrade pip
        pip install "cython<3.0.0" buildozer kivy

    - name: Build APK with Buildozer
      run: |
        # Pipe yes to auto-accept any downstream sdkmanager prompts, 
        # allowing the build to proceed uninterrupted, then verify APK output.
        yes | buildozer -v android debug || true
        ls -la bin/
        if [ -z "$(ls bin/*.apk 2>/dev/null)" ]; then
          echo "Error: APK compilation failed."
          exit 1
        fi

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: X9-Vault-APK
        path: bin/*.apk
