name: Build X9 Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install System Dependencies & Rust
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential ccache git libffi-dev libssl-dev python3-dev \
          zip unzip openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev \
          libncurses-dev cmake rustc cargo

    - name: Install Pinned Python Build Tools
      run: |
        python -m pip install --upgrade pip
        pip install "cython<3.0.0" buildozer kivy

    - name: Build APK with Buildozer
      run: |
        yes | buildozer -v android debug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: X9-Vault-APK
        path: bin/*.apk
