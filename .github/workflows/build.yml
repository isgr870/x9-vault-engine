name: Build X9 Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Android SDK & Accept Licenses
      uses: android-actions/setup-android@v3
      with:
        packages: 'build-tools;33.0.2 platforms;android-33 platform-tools cmdline-tools;latest'
        accept-android-sdk-licenses: true

    - name: Install System Dependencies & Rust
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential ccache git libffi-dev libssl-dev python3-dev \
          zip unzip autoconf automake libtool libtool-bin gettext autopoint \
          pkg-config zlib1g-dev libncurses-dev cmake rustc cargo dh-autoreconf

    - name: Install Rust Android Targets
      run: |
        rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android i686-linux-android

    - name: Install Pinned Python Build Tools
      run: |
        python -m pip install --upgrade pip
        pip install "cython<3.0.0" buildozer kivy

    - name: Configure Buildozer SDK & Macro Paths
      run: |
        SDK_PATH="/usr/local/lib/android/sdk"
        mkdir -p "$SDK_PATH/tools/bin"
        if [ -f "$SDK_PATH/cmdline-tools/latest/bin/sdkmanager" ]; then
          ln -sf "$SDK_PATH/cmdline-tools/latest/bin/sdkmanager" "$SDK_PATH/tools/bin/sdkmanager"
        fi
        mkdir -p /home/runner/.buildozer/android/platform
        rm -rf /home/runner/.buildozer/android/platform/android-sdk
        ln -s "$SDK_PATH" /home/runner/.buildozer/android/platform/android-sdk
        echo "SDK and symlinks configured successfully."

    - name: Build APK with Buildozer
      run: |
        export ANDROID_HOME=/usr/local/lib/android/sdk
        export ANDROID_SDK_ROOT=/usr/local/lib/android/sdk
        export ACLOCAL_PATH="/usr/share/aclocal:/usr/share/automake-1.16"
        buildozer -v android debug
        echo "Locating generated APK files:"
        find . -name "*.apk" -ls

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: X9-Vault-APK
        path: |
          bin/*.apk
          *.apk
          **/bin/*.apk
        if-no-files-found: error
